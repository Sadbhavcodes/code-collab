spring.application.name=backend

# ── DataSource (H2 in-memory for dev) ─────────────────────────
spring.datasource.url=jdbc:h2:mem:codecollab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ────────────────────────────────────────────
# spring.jpa.database-platform is intentionally omitted — Hibernate 6 auto-detects H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console (dev only) ──────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=atmkbfjgatmkbfjgatmkbfjgatmkbfjgatmkbfjgatmkbfjgatmkbfjgatmkbfjg
jwt.expiration=86400000
